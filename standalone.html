<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIMER — Your Personal AI Tutor</title>
  <meta name="description" content="PRIMER is an AI-powered personal tutor that adapts every lesson to your child's learning pace. Affordable 1-to-1 education for KG-12 students.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              indigo: '#4f46e5',
              violet: '#8b5cf6',
              blue: '#3b82f6',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
          }

  <style>
    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: #fafaff;
      color: #0f0f1b;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .text-gradient {
      background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bg-grid-pattern {
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(99, 102, 241, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
    }
    /* Floating Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float-slow { animation: float 6s ease-in-out infinite; }
    .animate-float-medium { animation: float 4s ease-in-out infinite; }
    .animate-float-fast { animation: float 2.5s ease-in-out infinite; }
    
    /* Scroll Reveal styles */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>

  <!-- React UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- App implementation -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONS (Inline SVGs to bypass UMD module resolution) ---
    const GraduationCapIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
    );
    const ArrowRightIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="h-4 w-4"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    );
    const MenuIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    );
    const XIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const SparklesIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-4 w-4 text-brand-500 fill-brand-200 animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5Z"/><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"/></svg>
    );
    const PlayIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="h-4 w-4 text-slate-500"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );
    const UsersIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const BotIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    );
    const CheckIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-3.5 w-3.5"><path d="M20 6 9 17l-5-5"/></svg>
    );
    const BrainIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1 0-3.12 3 3 0 0 1 0-4.88 2.5 2.5 0 0 1 0-3.12A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 0-3.12 3 3 0 0 0 0-4.88 2.5 2.5 0 0 0 0-3.12A2.5 2.5 0 0 0 14.5 2Z"/></svg>
    );
    const TargetIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    );
    const LightbulbIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    );
    const GlobeIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    );
    const AlertTriangleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-5 w-5 text-rose-500"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
    );
    const FlameIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-5 w-5 text-amber-500 fill-current animate-pulse"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    );

    // --- Custom Scroll Reveal Hook ---
    const useScrollReveal = () => {
      useEffect(() => {
        const revealElements = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, { threshold: 0.1 });
        
        revealElements.forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    };

    // --- App Component ---
    function App() {
      useScrollReveal();
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isScrolled, setIsScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const handleScrollTo = (e, id) => {
        e.preventDefault();
        const target = document.querySelector(id);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
        setIsMobileMenuOpen(false);
      };

      return (
        <div className="min-h-screen bg-[#fafaff] font-sans antialiased text-slate-900 selection:bg-brand-500/25 selection:text-brand-900">
          
          {/* STICKY NAVBAR */}
          <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${
            isScrolled 
              ? 'py-3 bg-white/75 backdrop-blur-md border-b border-indigo-100/40 shadow-sm' 
              : 'py-5 bg-transparent'
          }`}>
            <div className="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
              <a href="#home" onClick={(e) => handleScrollTo(e, '#home')} className="flex items-center gap-2 group">
                <div className="bg-gradient-to-tr from-brand-600 to-brand-400 p-2 rounded-xl text-white shadow-md">
                  <GraduationCapIcon />
                </div>
                <div className="flex flex-col">
                  <span className="text-2xl font-extrabold tracking-tight text-slate-900 group-hover:text-brand-600 transition-colors">
                    PRIMER
                  </span>
                  <span className="text-[10px] text-slate-500 font-medium tracking-wide -mt-1">
                    Your Personal AI Tutor
                  </span>
                </div>
              </a>

              <div className="hidden md:flex items-center gap-8">
                <a href="#home" onClick={(e) => handleScrollTo(e, '#home')} className="text-slate-600 hover:text-brand-600 font-medium text-sm transition-colors">Home</a>
                <a href="#how-it-works" onClick={(e) => handleScrollTo(e, '#how-it-works')} className="text-slate-600 hover:text-brand-600 font-medium text-sm transition-colors">How It Works</a>
                <a href="#features" onClick={(e) => handleScrollTo(e, '#features')} className="text-slate-600 hover:text-brand-600 font-medium text-sm transition-colors">Features</a>
                <a href="#why-primer" onClick={(e) => handleScrollTo(e, '#why-primer')} className="text-slate-600 hover:text-brand-600 font-medium text-sm transition-colors">Why PRIMER</a>
              </div>

              <div className="hidden md:block">
                <a href="#cta" onClick={(e) => handleScrollTo(e, '#cta')} className="inline-flex items-center gap-2 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 text-white px-5 py-2.5 rounded-full text-sm font-semibold shadow-md shadow-brand-500/20 hover:shadow-lg transition-all duration-300">
                  Start Learning <ArrowRightIcon />
                </a>
              </div>

              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden text-slate-600 p-1">
                {isMobileMenuOpen ? <XIcon /> : <MenuIcon />}
              </button>
            </div>

            {/* Mobile Dropdown */}
            {isMobileMenuOpen && (
              <div className="absolute top-full left-0 right-0 bg-white border-b border-slate-100 shadow-xl py-6 px-6 flex flex-col gap-4 md:hidden">
                <a href="#home" onClick={(e) => handleScrollTo(e, '#home')} className="text-slate-700 hover:text-brand-600 font-semibold text-lg py-2 border-b border-slate-50">Home</a>
                <a href="#how-it-works" onClick={(e) => handleScrollTo(e, '#how-it-works')} className="text-slate-700 hover:text-brand-600 font-semibold text-lg py-2 border-b border-slate-50">How It Works</a>
                <a href="#features" onClick={(e) => handleScrollTo(e, '#features')} className="text-slate-700 hover:text-brand-600 font-semibold text-lg py-2 border-b border-slate-50">Features</a>
                <a href="#why-primer" onClick={(e) => handleScrollTo(e, '#why-primer')} className="text-slate-700 hover:text-brand-600 font-semibold text-lg py-2 border-b border-slate-50">Why PRIMER</a>
                <a href="#cta" onClick={(e) => handleScrollTo(e, '#cta')} className="inline-flex justify-center items-center gap-2 bg-brand-600 text-white py-3.5 rounded-2xl text-base font-semibold shadow-lg">
                  Start Learning <ArrowRightIcon />
                </a>
              </div>
            )}
          </nav>

          {/* HERO SECTION */}
          <section id="home" className="relative min-h-screen pt-28 pb-16 flex items-center bg-grid-pattern overflow-hidden bg-[#fafaff]">
            <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-gradient-to-tr from-brand-300/20 to-brand-100/10 blur-[120px] pointer-events-none" />
            <div className="absolute bottom-[10%] right-[-10%] w-[45%] h-[45%] rounded-full bg-gradient-to-br from-indigo-300/15 to-blue-200/15 blur-[100px] pointer-events-none" />

            <div className="max-w-7xl mx-auto px-6 md:px-12 w-full grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
              <div className="lg:col-span-7 flex flex-col items-start text-left z-10">
                <div className="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-50 border border-indigo-100/50 rounded-full text-brand-700 font-semibold text-xs mb-6 shadow-sm">
                  <SparklesIcon />
                  <span>AI-Powered Personalized Learning</span>
                </div>
                <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-slate-900 leading-[1.1] mb-4">
                  Every child deserves a <span className="text-gradient">personal tutor.</span>
                </h1>
                <h2 className="text-2xl sm:text-3xl md:text-4xl font-bold text-brand-600 mb-6">
                  Not every parent can afford one.
                </h2>
                <p className="text-lg text-slate-600 max-w-xl leading-relaxed mb-8">

                <div className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto mb-8">

                <div className="flex flex-wrap items-center gap-y-2 gap-x-6 text-sm text-slate-500 font-medium border-t border-slate-100 pt-6 w-full max-w-xl">

                  <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-indigo-500" /> Practice</span>

                  <div className="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent pointer-events-none" />
                  
                  {/* Card overlay */}
                  <div className="absolute bottom-6 left-6 right-6 p-5 glass-panel rounded-2xl shadow-2xl border border-white/50">
                    <div className="flex justify-between items-start mb-3">
                      <div>
                        <h4 className="font-bold text-slate-800 text-base">Hi Aarav 👋</h4>
                        <p className="text-[11px] text-slate-500 font-medium">Let's learn fractions today.</p>
                      </div>
                      <span className="px-2 py-0.5 bg-brand-50 text-[10px] font-bold text-brand-600 rounded-md border border-brand-100">
                        Level 2
                      </span>
                    </div>
                    <div className="mb-4">
                      <div className="flex justify-between items-center text-[10px] font-bold text-slate-600 mb-1">
                        <span>Current Mastery</span>
                        <span className="text-brand-600">78%</span>
                      </div>
                      <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-brand-600 to-indigo-500 rounded-full" style={{ width: '78%' }} />
                      </div>
                    </div>
                    <div className="flex items-center justify-between border-t border-indigo-50/50 pt-3">
                      <div className="flex flex-col">
                        <span className="text-[9px] font-semibold text-slate-400 uppercase tracking-wider">Today's Goal</span>
                        <span className="text-[11px] font-bold text-slate-700">Understand equivalent fractions</span>
                      </div>
                      <button className="bg-brand-600 text-white p-2 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow-sm">
                        <span>Continue</span> <ArrowRightIcon />
                      </button>
                    </div>
                  </div>
                </div>

                {/* Floating Badges */}

                  <span className="text-sm">📚</span>
                  <div className="flex flex-col">
                    <span className="text-xs font-bold text-slate-800">AI Tutor</span>
                    <span className="text-[9px] text-emerald-500 font-bold">Online & Active</span>
                  </div>
                </div>
                <div className="absolute -right-4 top-1/3 px-4 py-2.5 bg-white rounded-2xl shadow-lg border border-slate-100 flex items-center gap-2 animate-float-medium">
                  <span className="text-sm">⭐</span>
                  <div className="flex flex-col">
                    <span className="text-[10px] text-slate-400 font-semibold uppercase">Progress</span>
                    <span className="text-xs font-extrabold text-slate-800">78% Mastery</span>
                  </div>
                </div>
                <div className="absolute bottom-40 -left-6 px-4 py-2.5 bg-white rounded-2xl shadow-lg border border-slate-100 flex items-center gap-2 animate-float-fast">

              </div>

          {/* PROBLEM SECTION */}
          <section id="problem" className="py-24 bg-white relative overflow-hidden reveal">
            <div className="max-w-7xl mx-auto px-6 md:px-12 relative z-10">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <h2 className="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">

                <p className="text-lg text-slate-600 leading-relaxed">

              </div>

              <div className="grid grid-cols-1 lg:grid-cols-11 gap-8 items-center">
                <div className="lg:col-span-5 bg-slate-50 border border-slate-200/60 rounded-3xl p-8 shadow-sm">
                  <div className="flex items-center gap-3 mb-6">
                    <div className="bg-slate-200 text-slate-700 p-2.5 rounded-2xl"><UsersIcon /></div>
                    <div>
                      <h3 className="text-xl font-bold text-slate-800">Traditional Classroom</h3>
                      <p className="text-xs text-slate-500 font-semibold uppercase">One-to-Many Model</p>
                    </div>
                  </div>
                  <div className="bg-white border border-slate-100 rounded-2xl p-6 mb-6 flex flex-col items-center">
